name: Routebase
description: API lifecycle platform covering Design (visual OpenAPI editor), Mock (spec-driven mock servers), Test
  (suites, assertions, OWASP security scanning), Document (published docs portals), and Agents (MCP server), built
  around a single living OpenAPI spec.
