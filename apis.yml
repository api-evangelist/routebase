apis:
- name: Routebase API
  description: The public, customer-committed part of the Routebase API — CLI-driven CI test runs, spec
    versioning and promotion, OWASP security scanning with SARIF export, docs-as-code, and SCIM 2.0 user
    provisioning. Authenticated with an X-API-Key (rb_live_) key scoped per permission and project; SCIM
    uses a separate bearer token. Errors are RFC 9457 problem+json.
  image: https://routebase.dev/icon.png
  humanURL: https://docs.routebase.dev
  baseURL: https://api.routebase.dev
  tags:
  - API lifecycle management
