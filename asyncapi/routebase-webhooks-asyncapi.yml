asyncapi: 3.0.0
info:
  title: Routebase Webhooks
  version: 1.0.0
  description: >-
    AsyncAPI generated by API Evangelist from the documented Routebase webhook surface
    (https://docs.routebase.dev/webhooks/). Routebase POSTs signed JSON events to a
    customer-configured receiver endpoint. Event names and headers are documented
    verbatim; the receiver URL is customer-supplied (templated).
  contact:
    name: Routebase
    url: https://routebase.dev
  x-provenance:
    generated: '2026-09-13'
    method: generated
    source: https://docs.routebase.dev/webhooks/
defaultContentType: application/json
servers:
  receiver:
    host: '{webhookEndpoint}'
    protocol: https
    description: Customer-configured webhook receiver. Routebase sends HTTP POST deliveries here.
    variables:
      webhookEndpoint:
        description: The host of the endpoint you register in Routebase to receive events.
        default: example.com
channels:
  webhookDeliveries:
    address: /
    description: Signed webhook deliveries POSTed by Routebase to the configured endpoint.
    messages:
      routebaseEvent:
        $ref: '#/components/messages/RoutebaseEvent'
operations:
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/webhookDeliveries'
    summary: Receive a Routebase webhook delivery.
    messages:
      - $ref: '#/channels/webhookDeliveries/messages/routebaseEvent'
components:
  messages:
    RoutebaseEvent:
      name: RoutebaseEvent
      title: Routebase webhook event
      contentType: application/json
      headers:
        type: object
        properties:
          X-Routebase-Signature:
            type: string
            description: 'sha256=<HMAC-SHA256 of the raw body computed with the endpoint secret>'
          X-Routebase-Event:
            type: string
            description: The event type (e.g. test_run.failed).
          X-Routebase-Delivery:
            type: string
            description: Unique delivery identifier.
      payload:
        $ref: '#/components/schemas/EventEnvelope'
  schemas:
    EventEnvelope:
      type: object
      required: [eventType, timestamp]
      properties:
        eventType:
          type: string
          description: Dotted event name.
          examples:
            - test_run.failed
            - test_run.passed
            - monitor.schema_drift_detected
            - monitor.incident_opened
            - monitor.recovered
        timestamp:
          type: string
          format: date-time
        organizationId:
          type: [string, 'null']
        projectId:
          type: [string, 'null']
        actorUserName:
          type: string
        data:
          type: object
          description: Event-specific fields.
