status_codes:
- status: '400'
  meaning: Bad request — validation failure on the request body or parameters.
- status: '401'
  meaning: Unauthorized — missing or invalid API key / bearer token.
- status: '403'
  meaning: Forbidden — the key lacks the scope required for the operation.
- status: '404'
  meaning: Not found — the project, spec, version, page or resource does not exist or is not visible to the key.
- status: '409'
  meaning: Conflict — returned as application/problem+json (Problem); e.g. promoting/creating into a conflicting state, or a report not yet ready.
- status: '429'
  meaning: Too Many Requests — rate limit exceeded; application/problem+json with a Retry-After header.
